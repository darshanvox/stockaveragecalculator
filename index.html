<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Insights | Darshan's Financial Intelligence Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.05); }
        }
        .glow-sphere { animation: pulseGlow 8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-900 min-h-screen relative overflow-x-hidden">
    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#030712]/75 border-b border-slate-900">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="text-sm font-black tracking-widest bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">📊 ALPHA INSIGHTS</a>
            <span class="text-[10px] font-mono font-bold text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 px-3 py-1 rounded-full uppercase tracking-wider">Live Portal</span>
        </div>
    </nav>
    <header class="max-w-4xl mx-auto px-6 pt-16 pb-10 text-center relative z-10">
        <h1 class="text-4xl md:text-5xl font-black text-white tracking-tight mb-2">ALPHA INSIGHTS</h1>
        <p class="text-xs md:text-sm font-medium text-slate-400">Hi, I am <span class="text-slate-200 font-semibold">Darshan</span>, a <span class="text-emerald-400 font-bold">CFA Level 2 Candidate</span></p>
    </header>
    <main class="max-w-4xl mx-auto px-6 pb-24 relative z-10 space-y-16">
        <section class="bg-slate-900/30 backdrop-blur-xl rounded-3xl border border-slate-800/60 p-6 md:p-8 shadow-2xl">
            <h2 class="text-lg font-bold text-white mb-6">Stock market average calculator</h2>
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-slate-950/40 p-5 rounded-2xl border border-slate-800/50">
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-4">First Purchase</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div><input type="number" id="qty1" placeholder="Units" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3 py-2 text-sm text-white font-mono"></div>
                        <div><input type="number" id="price1" step="any" placeholder="Price" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3 py-2 text-sm text-[#10b981] font-mono"></div>
                    </div>
                </div>
                <div class="bg-slate-950/40 p-5 rounded-2xl border border-slate-800/50">
                    <h3 class="text-xs font-bold text-slate-400 uppercase mb-4">Second Purchase</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div><input type="number" id="qty2" placeholder="Units" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3 py-2 text-sm text-white font-mono"></div>
                        <div><input type="number" id="price2" step="any" placeholder="Price" class="w-full bg-[#030712] border border-slate-800 rounded-xl px-3 py-2 text-sm text-[#10b981] font-mono"></div>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                <button type="button" id="btnCalculate" class="sm:col-span-2 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-slate-950 font-black text-xs uppercase px-6 py-4 rounded-xl cursor-pointer">Calculate Average</button>
                <button type="button" id="btnClear" class="bg-slate-800/50 border border-slate-700/50 text-slate-300 font-bold text-xs uppercase px-6 py-4 rounded-xl cursor-pointer">Clear Fields</button>
            </div>
            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800/80">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center md:text-left">
                    <div><span class="text-[10px] font-bold text-slate-500 uppercase">Total Units</span><div class="text-2xl font-black text-white font-mono" id="totalQtyDisplay">0</div></div>
                    <div><span class="text-[10px] font-bold text-emerald-400 uppercase">Average Price</span><div class="text-2xl font-black text-[#10b981] font-mono" id="avgPriceDisplay">0.00</div></div>
                    <div><span class="text-[10px] font-bold text-slate-500 uppercase">Total Outlay</span><div class="text-2xl font-black text-[#10b981] font-mono" id="totalCostDisplay">0.00</div></div>
                </div>
            </div>
        </section>
    </main>
    <script>
        const btnCalculate = document.getElementById('btnCalculate');
        const btnClear = document.getElementById('btnClear');
        function runCostAveraging() {
            const q1 = Math.max(0, parseFloat(document.getElementById('qty1').value) || 0);
            const p1 = Math.max(0, parseFloat(document.getElementById('price1').value) || 0);
            const q2 = Math.max(0, parseFloat(document.getElementById('qty2').value) || 0);
            const p2 = Math.max(0, parseFloat(document.getElementById('price2').value) || 0);
            const totalQty = q1 + q2;
            const totalOutlay = (q1 * p1) + (q2 * p2);
            const avgPrice = totalQty > 0 ? (totalOutlay / totalQty) : 0;
            document.getElementById('totalQtyDisplay').textContent = totalQty.toLocaleString();
            document.getElementById('avgPriceDisplay').textContent = avgPrice.toFixed(2);
            document.getElementById('totalCostDisplay').textContent = totalOutlay.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        function resetCalculator() {
            document.getElementById('qty1').value = '';
            document.getElementById('price1').value = '';
            document.getElementById('qty2').value = '';
            document.getElementById('price2').value = '';
            document.getElementById('totalQtyDisplay').textContent = '0';
            document.getElementById('avgPriceDisplay').textContent = '0.00';
            document.getElementById('totalCostDisplay').textContent = '0.00';
        }
        btnCalculate.addEventListener('click', runCostAveraging);
        btnClear.addEventListener('click', resetCalculator);
    </script>
</body>
</html>
