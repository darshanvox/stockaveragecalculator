<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Insights | Elite Financial Intelligence</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Smooth pulsating background glow animations */
        @keyframes meshGlow {
            0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.4; }
            33% { transform: translate(40px, -60px) scale(1.1); opacity: 0.6; }
            66% { transform: translate(-30px, 20px) scale(0.95); opacity: 0.5; }
        }
        .animate-mesh-1 { animation: meshGlow 10s infinite ease-in-out; }
        .animate-mesh-2 { animation: meshGlow 12s infinite ease-in-out; animation-delay: 2s; }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-slate-900 min-h-screen relative overflow-x-hidden">

    <!-- Trendy Floating Neon Orbs (Background Accents) -->
    <div class="absolute top-[-10%] left-[-5%] w-[60vw] h-[60vw] rounded-full bg-gradient-to-br from-fuchsia-600/10 via-purple-600/10 to-transparent blur-[130px] animate-mesh-1 pointer-events-none"></div>
    <div class="absolute top-[30%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-br from-cyan-500/15 via-emerald-500/5 to-transparent blur-[110px] animate-mesh-2 pointer-events-none"></div>

    <!-- 🌟 STICKY HEADER: Ultra-Modern Glassmorphic Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-[#030712]/75 border-b border-slate-800/80 shadow-lg shadow-slate-950/20">
        <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Brand Logo with Gradient Pop -->
            <a href="index.html" class="text-xl font-black tracking-widest bg-gradient-to-r from-cyan-400 via-violet-400 to-fuchsia-400 bg-clip-text text-transparent hover:brightness-125 transition duration-300">
                ⚡ ALPHA INSIGHTS
            </a>
            <!-- Premium Status Tag -->
            <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800/80 rounded-xl px-3.5 py-1.5 shadow-inner">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-400"></span>
                </span>
                <span class="text-[10px] font-mono font-black tracking-wider text-slate-400 uppercase">Live Engine v2.4</span>
            </div>
        </div>
    </nav>

    
    <header class="max-w-4xl mx-auto px-6 pt-12 pb-2 text-center relative z-10">
        <!-- Trendy Cyberpunk Profile Pill -->
        <div class="inline-flex items-center gap-2.5 bg-slate-900/60 border border-purple-500/30 backdrop-blur-md rounded-2xl px-5 py-2.5 text-xs md:text-sm font-bold text-slate-200 shadow-2xl tracking-wide">
            <span class="text-purple-400">⚡</span>
            Hi, I am <span class="bg-gradient-to-r from-purple-400 to-cyan-400 bg-clip-text text-transparent font-black">Darshan</span>, a CFA Level 2 Candidate
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-6 pb-24 relative z-10 space-y-12">
        
        <!-- 📦 CALCULATOR CONTAINER: Outer Gradient Neon Border Wrap -->
        <section class="p-[1px] bg-gradient-to-br from-slate-800 via-cyan-500/30 to-purple-500/20 rounded-3xl shadow-2xl shadow-slate-950/70">
            <!-- Inner Box Content -->
            <div class="bg-[#090f24]/90 backdrop-blur-2xl rounded-[23px] p-6 md:p-8 space-y-8">
                
                <!-- Title Header Inside Card -->
                <div class="flex items-center gap-3.5 border-b border-slate-800/80 pb-5">
                    <div class="p-2.5 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 text-white shadow-xl shadow-cyan-500/10 text-sm">🤖</div>
                    <div>
                        <h2 class="text-lg font-black tracking-wide text-white uppercase">Stock market average calculator</h2>
                        <p class="text-xs text-slate-400 font-light">Evaluate custom positioning matrices across discrete entry tranches</p>
                    </div>
                </div>

                <!-- Input Grid Field Sections -->
                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Tranche 1 Frame -->
                    <div class="bg-slate-950/40 p-5 rounded-2xl border border-slate-800/40 hover:border-slate-800/90 transition duration-300">
                        <h3 class="text-xs font-black text-cyan-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-lg shadow-cyan-400"></span> First Purchase
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Units</label>
                                <input type="number" id="qty1" placeholder="0" class="w-full bg-[#030712] border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm text-white font-bold focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/20 transition-all">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Price / Share</label>
                                <input type="number" id="price1" step="any" placeholder="₹0.00" class="w-full bg-[#030712] border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm text-white font-bold focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400/20 transition-all">
                            </div>
                        </div>
                    </div>

                    <!-- Tranche 2 Frame -->
                    <div class="bg-slate-950/40 p-5 rounded-2xl border border-slate-800/40 hover:border-slate-800/90 transition duration-300">
                        <h3 class="text-xs font-black text-purple-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-purple-400 shadow-lg shadow-purple-400"></span> Second Purchase
                        </h3>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Units</label>
                                <input type="number" id="qty2" placeholder="0" class="w-full bg-[#030712] border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm text-white font-bold focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400/20 transition-all">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Price / Share</label>
                                <input type="number" id="price2" step="any" placeholder="₹0.00" class="w-full bg-[#030712] border border-slate-800/80 rounded-xl px-4 py-2.5 text-sm text-white font-bold focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400/20 transition-all">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 🚀 BUTTONS: Trendy High-Pop Neo-morphic Shadows -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                    <button type="button" id="btnCalculate" class="sm:col-span-2 bg-gradient-to-r from-cyan-400 via-teal-400 to-emerald-400 text-slate-950 font-black text-xs uppercase tracking-widest py-4.5 rounded-2xl shadow-xl shadow-cyan-400/10 hover:shadow-cyan-400/20 hover:-translate-y-1 active:translate-y-0 transition-all duration-300 select-none cursor-pointer transform">
                        Calculate Position Average
                    </button>
                    <button type="button" id="btnClear" class="bg-slate-900 border border-slate-800/80 hover:border-slate-700 text-slate-300 font-black text-xs uppercase tracking-widest py-4.5 rounded-2xl hover:-translate-y-1 active:translate-y-0 transition-all duration-300 select-none cursor-pointer transform shadow-md hover:text-white">
                        Clear Fields
                    </button>
                </div>

                <!-- Metrics Display Panel Footer Inside Box -->
                <div class="p-5 bg-[#030712]/80 rounded-2xl border border-slate-800/60 shadow-inner grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-0">
                    <div class="text-center md:text-left space-y-1 md:pl-4">
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest block">Total Shares Pool</span>
                        <div class="text-2xl font-black text-white" id="totalQtyDisplay">0</div>
                    </div>
                    <div class="text-center md:text-left space-y-1 md:border-x border-slate-800/60 py-4 md:py-0 md:px-8">
                        <span class="text-[9px] font-black text-cyan-400 uppercase tracking-widest block">Position Cost Basis</span>
                        <div class="text-2xl font-black text-cyan-400" id="avgPriceDisplay">₹0.00</div>
                    </div>
                    <div class="text-center md:text-left space-y-1 md:pl-8">
                        <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest block">Gross Total Outlay</span>
